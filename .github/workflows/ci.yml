name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, tests, evaluation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff) - whole repo, including demo_storefront/scripts
        run: ruff check .

      - name: Type check (mypy) - app, demo_storefront, scripts
        run: mypy app demo_storefront scripts

      - name: Unit + integration + workflow tests (mock LLM, sqlite, in-memory vector store)
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Security tests
        run: pytest -q tests/security

      - name: Evaluation suite (mock LLM, no API keys needed)
        run: python tests/evaluation/run_evaluation.py

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Type check (tsc)
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - service: api
            context: .
          - service: demo_storefront
            context: ./demo_storefront
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -t customer-support-workflow-${{ matrix.service }}:ci ${{ matrix.context }}
